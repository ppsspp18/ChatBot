<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>LLM Quiz Generator - Quiz Mode</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-nav">
    <a href="quiz.html" class="back-btn-top" onclick="event.preventDefault(); location.reload();">🔄 Reset / New Quiz</a>
  </div>

  <div class="container">
    <div class="card">
      <h1>LLM Quiz Generator</h1>
      
      <div class="topic-concept-grid">
        <div class="input-group-aesthetic">
          <label for="topic"><span>📚</span> Topic *</label>
           <div class="input-with-icon">
             <span class="input-icon">🔍</span>
             <input id="topic" placeholder="e.g. Python">
           </div>
         </div>
 
         <div class="input-group-aesthetic">
           <label for="concept"><span>💡</span> Concept *</label>
           <div class="input-with-icon">
             <span class="input-icon">🎯</span>
             <input id="concept" placeholder="e.g. Decorators">
           </div>
         </div>
      </div>
      
      <label for="difficulty">Difficulty *</label>
      <select id="difficulty">
        <option value="Easy">Easy</option>
        <option value="Medium" selected>Medium</option>
        <option value="Hard">Hard</option>
      </select>
      
      <label for="numQuestions">Number of Questions (1-100) *</label>
      <input type="number" id="numQuestions" value="5" min="1" max="100">
      
      <label for="additionalDescription">Additional Description (optional)</label>
      <textarea id="additionalDescription" placeholder="Focus on practical use cases, exclusions, style preferences..."></textarea>
      
      <div style="margin-top: 20px;">
        <button id="generateQuizBtn">⚡ Generate Quiz with AI</button>
      </div>
    </div>

    <div class="card" id="savedQuizzesCard">
      <h2>📂 Load Old Quiz</h2>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <select id="savedQuizzesSelect" style="flex: 1; min-width: 250px;">
          <option value="">-- Select a previously generated quiz --</option>
        </select>
        <button id="loadSavedQuizBtn" style="min-width: 120px;">Load Quiz</button>
      </div>
    </div>

    <div id="quiz"></div>
    <div id="submitArea"></div>
    <div id="result"></div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
