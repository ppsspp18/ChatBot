<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Quizzes - ChatBot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="q-header">
    <div class="q-header-left">
      <a href="../.." class="q-btn q-btn-ghost" id="backHomeBtn">← Home</a>
    </div>
    <div class="q-header-right">
      <button id="logoutBtn" class="q-btn q-btn-ghost" type="button">Logout</button>
    </div>
  </header>

  <main class="q-container">
    <!-- ── List of quizzes ─────────────────────────────────────────── -->
    <section id="listView" class="q-view">
      <div class="q-list-header">
        <div>
          <h1>Your Quizzes</h1>
          <p id="quizCount" class="q-muted"></p>
        </div>
        <button class="q-btn q-btn-primary" id="newQuizBtn" type="button">+ New Quiz</button>
      </div>
      <div id="quizList" class="q-list"></div>
    </section>

    <!-- ── Taking a quiz ───────────────────────────────────────────── -->
    <section id="detailView" class="q-view hidden">
      <div class="q-detail-top">
        <button class="q-btn q-btn-ghost" id="backToListBtn" type="button">← All Quizzes</button>
      </div>
      <div id="quizDetail"></div>
    </section>
  </main>

  <!-- ── New quiz modal (simple) ──────────────────────────────────── -->
  <div id="newQuizModal" class="q-modal hidden">
    <div class="q-modal-overlay" id="newQuizOverlay"></div>
    <div class="q-modal-card">
      <h2>New Quiz</h2>

      <div class="q-form-group">
        <label for="topicInput">Topic *</label>
        <input id="topicInput" type="text" placeholder="e.g. Python" />
      </div>

      <div class="q-form-group">
        <label for="conceptInput">Concept *</label>
        <input id="conceptInput" type="text" placeholder="e.g. Decorators" />
      </div>

      <div class="q-form-row">
        <div class="q-form-group">
          <label for="difficultyInput">Difficulty *</label>
          <select id="difficultyInput">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
        <div class="q-form-group">
          <label for="numQuestionsInput">Questions (1-10) *</label>
          <input id="numQuestionsInput" type="number" min="1" max="10" value="5" />
        </div>
      </div>

      <div class="q-form-group">
        <label for="additionalInput">Additional Description (optional)</label>
        <textarea id="additionalInput" rows="3" placeholder="Any extra focus for the quiz..."></textarea>
      </div>

      <p id="quizFormError" class="q-error hidden"></p>

      <div class="q-modal-actions">
        <button class="q-btn q-btn-ghost" id="cancelNewQuizBtn" type="button">Cancel</button>
        <button class="q-btn q-btn-primary" id="generateQuizBtn" type="button">Generate Quiz</button>
      </div>
    </div>
  </div>

  <!-- ── Loading overlay ───────────────────────────────────────────── -->
  <div id="loadingOverlay" class="q-loading-overlay hidden">
    <div class="q-loading-card">
      <div class="q-spinner"></div>
      <p>Generating quiz… this can take a few seconds</p>
    </div>
  </div>

  <script type="module" src="quiz.js"></script>
</body>
</html>
